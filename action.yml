name: 'Deploy thiscovery'
description: 'Deploys thiscovery stack'
inputs:
  template_name:
    description: 'Packaged template artifact name'
    required: true
  deployment_role:
    description: 'AWS role to assume'
    required: true
  python-version:
    description: 'Python version to pass to setup-python'
    required: false
    default: '3.13'

runs:
  using: "composite"
  steps:
    - name: Assume the deployment pipeline user role
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-access-key-id: ${{ env.PIPELINE_USER_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.PIPELINE_USER_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ inputs.deployment_role }}
        role-session-name: ${{ env.STACK_NAME }}-deployment
        role-duration-seconds: 3600
        role-skip-session-tagging: true

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - uses: aws-actions/setup-sam@v2
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.template_name }}

    - name: Install dependencies
      shell: bash
      run: |
        pip install -r requirements.txt

    - name: Deploy using thiscovery script
      shell: bash
      run: |
        thiscovery deploy ${{ env.STACK_NAME }}